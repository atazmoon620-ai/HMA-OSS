name: Main

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ubuntu-latest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build APK
        run: |
          ./gradlew :app:assembleDebug --stacktrace

      - name: Upload Custom HMA APK
        uses: actions/upload-artifact@v4
        with:
          name: Custom-HMA-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Build Zygisk Module
        continue-on-error: true
        run: |
          ./gradlew :zygote:assembleRelease --stacktrace || ./gradlew :zygote:assemble --stacktrace

      - name: Upload Zygisk Module
        uses: actions/upload-artifact@v4
        with:
          name: Zygisk-Module-Zip
          path: zygote/build/outputs/magisk/**
          if-no-files-found: ignore
          
