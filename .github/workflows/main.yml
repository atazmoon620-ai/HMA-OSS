name: Build HMA-OSS Custom

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ubuntu-latest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Step 1 - Build APK
        run: |
          ./gradlew :app:assembleDebug --stacktrace

      - name: Step 2 - Build Zygote Magisk Module
        run: |
          ./gradlew :zygote:assembleDebug --stacktrace || ./gradlew :zygote:assemble --stacktrace

      - name: Upload Custom HMA APK
        uses: actions/upload-artifact@v4
        with:
          name: Custom-HMA-APK
          path: app/build/outputs/apk/**/*.apk

      - name: Upload KernelSU Zygisk Module
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU-Zygisk-Module
          path: |
            zygote/build/outputs/**/*.zip
            out/*.zip
            build/outputs/**/*.zip
            
